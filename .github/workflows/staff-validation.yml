name: KANI staff validation
on:
  push:
    branches: [codex/kani-five-accounts-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:staff
      - run: pnpm run test:notifications
      - run: pnpm run test:booking
      - run: pnpm run test:public-booking
      # Includes the existing staff SQL suite, then the visibility migration probes.
      - run: pnpm run test:public-booking:sql
      - run: pnpm run test:availability:sql
      - run: pnpm run test:notifications:sql
      - run: pnpm run build
      - name: Check generated Preview configuration
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync(".output/server/wrangler.json", "utf8"));
            if (!config.previews || typeof config.previews !== "object" || Array.isArray(config.previews)) {
              throw new Error("Nitro output must preserve the Wrangler previews block");
            }
            console.log("Generated Wrangler Preview configuration: OK");
          '
